{% extends "base.html" %}

{% block title %}
LEVELUP — Registro
{% endblock %}

{% block content %}

<div class="contenedor">

    <div class="bienvenida">

        <h1>Crear cuenta</h1>

        <p class="fecha-hoy">
            Crea tu cuenta para comenzar tu progreso en LEVELUP.
        </p>

    </div>


    <div class="card">

        <h2>Registro</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Nombre de usuario"
                required>

            <input
                type="email"
                name="email"
                placeholder="Correo electrónico"
                required>

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
                required>


            <label for="rol">
                Tipo de cuenta:
            </label>

            <select name="rol" id="rol" required>

                <option value="padre">
                    Padre
                </option>

                <option value="hijo">
                    Hijo
                </option>

            </select>


            <input
                type="text"
                name="codigo_padre"
                placeholder="Código del padre (solo si eres hijo)">


            <button type="submit">
                Crear cuenta
            </button>

        </form>


        <p>
            ¿Ya tienes una cuenta?

            <a href="/login">
                Iniciar sesión
            </a>
        </p>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}
LEVELUP — Iniciar sesión
{% endblock %}

{% block content %}

<div class="contenedor">

    <div class="bienvenida">

        <h1>🔐 Iniciar sesión</h1>

        <p class="fecha-hoy">
            Entra a tu cuenta para continuar tu progreso.
        </p>

    </div>


    <div class="card">

        <h2>👤 Acceder</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Nombre de usuario"
                required>

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
                required>

            <button type="submit">
                🚀 Iniciar sesión
            </button>

        </form>


        <p>
            ¿No tienes una cuenta?

            <a href="/registro">
                Crear cuenta
            </a>
        </p>

    </div>

</div>

{% endblock %}
